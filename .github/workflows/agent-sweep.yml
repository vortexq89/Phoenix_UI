name: agent-sweep
# Daily triage of open Sentinel incidents (PUI_V2 16.6 / 16.11). Dry run unless
# the repository variable PHOENIX_SWEEP_DISPATCH is "true" (or the manual run
# asks for it); then new S0/S1 issues are handed to /phoenix/api/agent/dispatch.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dispatch:
        description: "Dispatch new S0/S1 issues to the review loop"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Triage open incidents
        env:
          PHOENIX_READ_TOKEN: ${{ secrets.PHOENIX_READ_TOKEN }}
          PHOENIX_BASE: ${{ vars.PHOENIX_BASE || 'https://www.vq8s.com' }}
          DISPATCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.dispatch) || vars.PHOENIX_SWEEP_DISPATCH == 'true' }}
        run: |
          if [ -z "$PHOENIX_READ_TOKEN" ]; then echo "PHOENIX_READ_TOKEN secret not configured; skipping"; exit 0; fi
          if [ "$DISPATCH" = "true" ]; then python3 .tools/agent_sweep.py --dispatch --out sweep-out; else python3 .tools/agent_sweep.py --out sweep-out; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-queue
          path: sweep-out/
          if-no-files-found: ignore
