name: api-watch
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  api-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Fetch Blizzard UI source (live, ptr, forever)
        run: |
          git clone --filter=blob:none --no-checkout --branch live https://github.com/Gethe/wow-ui-source.git /tmp/wowsrc
          git -C /tmp/wowsrc fetch origin ptr forever
      - name: Rebuild Data/ApiCatalog.json
        run: python3 .tools/api_catalog.py --src /tmp/wowsrc
      - name: Auto-fix (manifests, locale keys, harness stubs) and full local checks
        id: autofix
        run: |
          if python3 .tools/autofix.py > autofix.txt 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          cat autofix.txt
      - name: Open a PR when the catalog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f autofix.txt
          if git diff --quiet; then echo "catalog unchanged"; exit 0; fi
          branch="api-watch/$(date -u +%Y%m%d)"
          git config user.name "phoenix-api-watch"
          git config user.email "api-watch@users.noreply.github.com"
          git checkout -b "$branch"
          git add Data/ApiCatalog.json Data/ApiManifest.lua Data/SchemaIndex.lua Phoenix_UI_Locales/keys.txt .tools/harness/wow_stub.lua
          git commit -m "api: refresh ApiCatalog from wow-ui-source (auto-fixed manifests, locale keys, harness stubs)"
          git push origin "$branch"
          gh pr create --base main-v2 --head "$branch" --title "api: refresh ApiCatalog from wow-ui-source" --label api-drift \
            --body "Automated catalog refresh with .tools/autofix.py (manifests, locale keys, harness stubs regenerated). Local checks: ${{ steps.autofix.outputs.ok == 'true' && 'all pass' || 'see the autofix step log; a check still fails and needs a code change' }}." || true
