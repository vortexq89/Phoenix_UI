name: Lint

on:
  push:
    branches: [main, rework]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: luacheck (12.1.5 std, zero warnings)
        run: luacheck . --formatter plain

      - name: API reference check
        run: python3 tools/check_api.py

      - name: Game ID check (pinned 12.1.5 snapshot)
        run: python3 tools/check_ids.py

      - name: Locale coverage
        run: python3 tools/check_locales.py

      - name: Offline load test
        run: lua5.1 tools/smoke/harness.lua .
